name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, format, test, intent:stale
    runs-on: ubuntu-latest
    # Both VITE_* vars are required at app boot — providers hard-fail
    # without them. Storybook's vitest addon boots Vite which inlines
    # them, so they have to be present here too.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Fast static check — every shadcn primitive in src/components/ui/
      # must ship as .tsx + .meta.ts + .stories.tsx (see docs/design-system.md).
      - run: pnpm check:ui
      # Storybook's vitest addon renders every story in headless Chromium.
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test
      - run: pnpm intent:stale

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # The dev server boots the full app; Clerk + Convex providers throw
    # at module init when these are missing.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
