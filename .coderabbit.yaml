# CodeRabbit AI code review configuration.
# Install the GitHub App at https://github.com/apps/coderabbitai
# Reference: https://docs.coderabbit.ai/getting-started/configure-coderabbit/

language: en

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - '!**/*.gen.ts'
    - '!**/*.gen.tsx'
    - '!src/routeTree.gen.ts'
    - '!pnpm-lock.yaml'
    - '!convex/_generated/**'
    - '!.husky/_/**'
    - '!.wrangler/**'
    - '!.output/**'
    - '!dist/**'
    - '!playwright-report/**'
    - '!test-results/**'

  path_instructions:
    - path: 'src/routes/**'
      instructions: |
        TanStack Router file routes. Check that:
        - createFileRoute's path string matches the file location.
        - Loaders fetch via context.queryClient.ensureQueryData with
          queryOptions, and components consume the same queryOptions via
          useSuspenseQuery (so SSR hydrates without a refetch flash).
        - In-app navigation uses type-safe <Link to={...}>, not raw
          <a href> for paths the router owns.

    - path: 'src/integrations/clerk/**'
      instructions: |
        Clerk integration. Check that:
        - The publishable key is read from
          `import.meta.env.VITE_CLERK_PUBLISHABLE_KEY` and is never
          hardcoded.
        - Missing-key behavior degrades gracefully in dev (warn + render
          children) and throws in production.
        - Server-side auth uses `@clerk/react`, not
          `@clerk/tanstack-react-start`, per
          docs/adr/0001-clerk-react-not-tanstack-react-start.md.

    - path: 'convex/**/*.ts'
      instructions: |
        Convex schema, queries, mutations. Check that:
        - User-scoped functions call `ctx.auth.getUserIdentity()` and
          gate access on `identity.subject` (multi-tenant safety).
        - Queries on user-scoped tables use `.withIndex(...)` instead of
          `.filter()` over large collections.
        - Schema enums use `v.union(v.literal(...), ...)`. Enum unions
          in `args` validators must mirror the schema.
        - Never edit files under `convex/_generated/` — regenerated by
          `convex dev`.

        Also follow `convex/_generated/ai/guidelines.md`, which overrides
        training-data assumptions about Convex.

    - path: 'wrangler.jsonc'
      instructions: |
        Cloudflare Workers config. `compatibility_flags` must include
        `"nodejs_compat"`; `main` must be
        `"@tanstack/react-start/server-entry"`. `VITE_*` values are
        build-time variables, not runtime secrets — see docs/deploy.md
        for the gotcha.

    - path: '**/*.test.ts'
      instructions: |
        Vitest unit specs (jsdom + @testing-library/react). Check that:
        - Specs are co-located with the source they cover.
        - Assertions target behavior via accessible-role/text queries,
          not implementation details.
        - Mocks live at boundaries (network, time, Convex client) only
          — avoid mocking internal modules.

    - path: 'e2e/**/*.spec.ts'
      instructions: |
        Playwright e2e specs (run against `pnpm dev`; see
        `playwright.config.ts`). Check that:
        - Specs are independent — no shared state between tests.
        - Locators prefer `getByRole` / accessible-name over CSS
          selectors.
        - First-navigation assertions account for cold-start timing on
          CI (see #9 for an example of where this bit us).

    - path: '.github/workflows/**'
      instructions: |
        GitHub Actions workflows. Check that:
        - Third-party actions are pinned to a major tag (`@v4`), not
          `@latest`.
        - An explicit `permissions:` block is declared (least-privilege).
        - Node + pnpm setup uses `pnpm/action-setup` +
          `actions/setup-node@v4` with `cache: pnpm`.
        - Expensive multi-job workflows declare a `concurrency` group
          so superseded PR runs cancel themselves.

    - path: '.husky/**'
      instructions: |
        Husky 9 hook scripts. User hooks in `.husky/` do NOT need a
        shebang (the `.husky/_/` wrapper handles execution). Scripts
        must be POSIX `sh`-compatible — no bash-only constructs.

chat:
  auto_reply: true
