# CodeRabbit AI code review configuration.
# Install the GitHub App at https://github.com/apps/coderabbitai
# Reference: https://docs.coderabbit.ai/getting-started/configure-coderabbit/

language: en

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - '!**/*.gen.ts'
    - '!**/*.gen.tsx'
    - '!**/routeTree.gen.ts'
    - '!pnpm-lock.yaml'
    - '!.wrangler/**'
    - '!.output/**'
    - '!dist/**'

  path_instructions:
    - path: 'src/routes/**'
      instructions: |
        These are TanStack Router file routes. Check that:
        - Route definitions use createFileRoute with a path string that matches the file location.
        - Loaders use context.queryClient.ensureQueryData with queryOptions when fetching, and components consume that data with useSuspenseQuery using the same queryOptions.
        - Links use type-safe Link with to={path}, not raw <a href> for in-app routes.
    - path: 'src/integrations/clerk/**'
      instructions: |
        Clerk integration code. Check that the publishable key is read from import.meta.env.VITE_CLERK_PUBLISHABLE_KEY and never hardcoded. Server-side auth should use clerkMiddleware when added.
    - path: 'wrangler.jsonc'
      instructions: |
        Cloudflare Workers config. Compatibility flags must include "nodejs_compat". The main entry must be "@tanstack/react-start/server-entry".

chat:
  auto_reply: true
